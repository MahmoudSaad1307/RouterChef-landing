<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Router Chef | Ultimate EdgeRouter Configuration App</title>
    <!-- Required CDNs -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <!-- Custom CSS -->
    <style>
        :root {
            --primary: #0056b3;
            --primary-light: #0077ff;
            --primary-dark: #003d82;
            --secondary: #1a2933;
            --secondary-light: #2c3e50;
            --accent: #00aaff;
            --accent-dark: #0088cc;
            --text-primary: #2d3748;
            --text-secondary: #4a5568;
            --light-bg: #f8fafc;
            --dark-bg: #1e293b;
            --hero-gradient: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
            --card-gradient: linear-gradient(to bottom right, #ffffff 0%, #f0f7ff 100%);
            --accent-gradient: linear-gradient(to right, var(--accent), var(--primary-light));
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.12);
            --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 25px rgba(0, 0, 0, 0.1);
            --shadow-xl: 0 20px 50px rgba(0, 0, 0, 0.15);
            --transition-fast: all 0.2s ease;
            --transition-normal: all 0.3s ease;
            --transition-slow: all 0.5s ease;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
            background-color: var(--light-bg);
        }

        /* Navigation Styles */
        .navbar {
            transition: var(--transition-normal);
            backdrop-filter: blur(10px);
            background: rgba(0, 86, 179, 0.9);
        }
        .navbar.scrolled { background: rgba(0, 86, 179, 0.95); }

        /* Hero Section */
        .hero-gradient { background: var(--hero-gradient); }
        .text-gradient {
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* Feature Cards */
        .feature-card {
            background: white;
            border-radius: 12px;
            box-shadow: var(--shadow-lg);
            transition: var(--transition-normal);
        }
        .feature-card:hover { transform: translateY(-10px); }

        /* Animations */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }
        .floating { animation: float 6s ease-in-out infinite; }

        /* Responsive Design Adjustments */
        @media (max-width: 768px) {
            .display-4 { font-size: 2.5rem; }
            .hero-section { padding-top: 80px !important; }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav id="navbar" class="navbar navbar-expand-lg navbar-dark fixed-top py-3">
        <!-- Navigation Content -->
    </nav>

    <!-- Hero Section -->
    <section class="hero-gradient text-white section pb-0 hero-section">
        <!-- Hero Content -->
    </section>

    <!-- Features Section -->
    <section id="features" class="section bg-light">
        <!-- Features Content -->
    </section>

    <!-- How It Works -->
    <section id="how-it-works" class="section">
        <!-- How It Works Content -->
    </section>

    <!-- Screenshots Section -->
    <section id="screenshots" class="section bg-light">
        <!-- Screenshots Content -->
    </section>

    <!-- Testimonials Section -->
    <section id="testimonials" class="section">
        <!-- Testimonials Content -->
    </section>

    <!-- CTA Section -->
    <section id="download" class="section hero-gradient text-white">
        <!-- CTA Content -->
    </section>

    <!-- FAQ Section -->
    <section class="section bg-light">
        <!-- FAQ Content -->
    </section>

    <!-- Footer -->
    <footer class="py-5 bg-dark text-white">
        <!-- Footer Content -->
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        // Initialize AOS
        AOS.init({
            duration: 1000,
            once: true,
            easing: 'ease-in-out'
        });

        // Navbar Scroll Effect
        window.addEventListener('scroll', function() {
            if (window.scrollY > 50) {
                document.getElementById('navbar').classList.add('scrolled');
            } else {
                document.getElementById('navbar').classList.remove('scrolled');
            }
        });

        // Smooth Scroll
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function(e) {
                e.preventDefault();
                document.querySelector(this.getAttribute('href')).scrollIntoView({
                    behavior: 'smooth'
                });
            });
        });
    </script>
</body>
</html>
